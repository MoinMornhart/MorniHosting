# MorniHosting – Start: `docker compose up -d`, dann http://<IP>:8080 öffnen.
name: mornihosting

services:
  panel:
    image: ghcr.io/pmornhart/mornihosting:${MH_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        MH_VERSION: ${MH_BUILD_VERSION:-dev}
    container_name: mornihosting
    restart: unless-stopped
    env_file: .env
    environment:
      MH_DOCKER_HOST: tcp://socket-proxy:2375
      MH_DATA_DIR: /data
      MH_MC_NETWORK: mornihosting-mc
    ports:
      - '${MH_PANEL_PORT:-8080}:8080'
    volumes:
      # Alle Server, Backups und die Panel-Datenbank liegen hier.
      - mornihosting-data:/data
    networks:
      - docker-api
      - minecraft
    depends_on:
      - socket-proxy
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Das Panel spricht Docker nur über diesen Proxy, nie direkt mit dem Socket.
  # Freigegeben ist nur, was für Minecraft-Container nötig ist.
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.1
    container_name: mornihosting-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      EXEC: 1
      INFO: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 1
      # Viele Proxmox-LXC haben kein IPv6; der Proxy ist ohnehin nur intern erreichbar.
      DISABLE_IPV6: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mornihosting-data:
    name: mornihosting-data

networks:
  # Nur Panel und Proxy, ohne Internet.
  docker-api:
    internal: true
  # Panel und Minecraft-Container (für RCON).
  minecraft:
    name: mornihosting-mc
