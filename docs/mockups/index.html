<title>MorniHosting Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: oben die Auswahl (Variante, Ansicht, Modus), darunter das Panel in voller Breite als Bühne */
:root {
  --v-bg: #eef2f0;
  --v-surface: #ffffff;
  --v-line: #d9e2dd;
  --v-fg: #13201a;
  --v-muted: #56675e;
  --v-accent: #0b8f63;
  --v-accent-soft: #d5f1e5;
  --v-font: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --v-bg: #0b100e; --v-surface: #121916; --v-line: #24302a; --v-fg: #e5eee9; --v-muted: #98aaa0;
    --v-accent: #3ed69f; --v-accent-soft: #123628; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --v-bg: #0b100e; --v-surface: #121916; --v-line: #24302a; --v-fg: #e5eee9; --v-muted: #98aaa0;
  --v-accent: #3ed69f; --v-accent-soft: #123628; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--v-bg); color: var(--v-fg); font: 15px/1.5 var(--v-font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.viewer { max-width: 1440px; margin: 0 auto; display: grid; gap: 20px; }
.v-head { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
.v-head h1 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.v-head p { margin: 0; color: var(--v-muted); max-width: 64ch; }
.v-controls { display: flex; flex-wrap: wrap; gap: 12px; }
.seg { display: inline-flex; background: var(--v-surface); border: 1px solid var(--v-line); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { font: 600 14px/1 var(--v-font); color: var(--v-muted); background: none; border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--v-accent-soft); color: var(--v-fg); }
.seg button:focus-visible, .v-card:focus-visible { outline: 2px solid var(--v-accent); outline-offset: 2px; }
.v-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.v-card { text-align: left; font: inherit; color: inherit; background: var(--v-surface); border: 1px solid var(--v-line); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; }
.v-card[aria-pressed="true"] { border-color: var(--v-accent); box-shadow: 0 0 0 1px var(--v-accent) inset; }
.v-card b { font-size: 16px; }
.v-card span { color: var(--v-muted); font-size: 14px; }
.v-note { color: var(--v-muted); font-size: 13px; margin: 0; }
@media (max-width: 760px) { .v-cards { grid-template-columns: 1fr; } }

.stage { container-type: inline-size; border-radius: 18px; overflow: hidden; border: 1px solid var(--v-line); }

/* ---------- Mockup-Tokens je Variante und Modus ---------- */
.mock {
  --g: #0e1512; --s: #151e1a; --s2: #1b2621; --s3: #223029; --ln: rgba(255,255,255,.06); --ln2: rgba(255,255,255,.12);
  --tx: #e9f1ed; --mu: #a2b5ab; --fa: #8a9d93;
  --ac: #10b981; --ac-hi: #34d399; --ac-ink: #032015; --ac-soft: rgba(16,185,129,.14);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.13); --warn: #f6b54e; --warn-soft: rgba(246,181,78,.14);
  --bad: #fb8a8a; --bad-soft: rgba(251,138,138,.13); --neu: #a2b5ab; --neu-soft: rgba(162,181,171,.12);
  --sh: 0 1px 2px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.28);
  --r: 16px; --r-sm: 10px; --r-btn: 12px;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif; --font-d: var(--font);
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --console: #0a0f0d;
  color-scheme: dark;
}
.mock[data-v="a"][data-mode="light"] {
  --g: #f2f6f4; --s: #ffffff; --s2: #f6faf8; --s3: #ebf2ee; --ln: #e2eae5; --ln2: #cfdcd5;
  --tx: #0f1f18; --mu: #4f6258; --fa: #5f7168;
  --ac: #059669; --ac-hi: #047857; --ac-ink: #ffffff; --ac-soft: #d8f3e8;
  --ok: #067a55; --ok-soft: #d8f3e8; --warn: #9a5b00; --warn-soft: #fdf0d8;
  --bad: #b42323; --bad-soft: #fde4e4; --neu: #55675e; --neu-soft: #e8efeb;
  --sh: 0 1px 2px rgba(15,40,28,.05), 0 8px 24px rgba(15,40,28,.07);
  --console: #0f1a15; color-scheme: light;
}
.mock[data-v="b"] {
  --g: #161618; --s: #202024; --s2: #29292e; --s3: #323238; --ln: #2f2f35; --ln2: #45454d;
  --tx: #f3f2ee; --mu: #b2b0a9; --fa: #9a9891;
  --ac: #49c463; --ac-hi: #5fd877; --ac-ink: #0b2410; --ac-soft: rgba(73,196,99,.15);
  --gold: #f0b443; --gold-soft: rgba(240,180,67,.15);
  --ok: #5fd877; --ok-soft: rgba(95,216,119,.14); --warn: #f0b443; --warn-soft: rgba(240,180,67,.15);
  --bad: #ff8f80; --bad-soft: rgba(255,143,128,.14); --neu: #b2b0a9; --neu-soft: rgba(178,176,169,.12);
  --sh: 0 4px 0 rgba(0,0,0,.35);
  --r: 12px; --r-sm: 8px; --r-btn: 8px;
  --font: "Rubik", "Segoe UI", system-ui, sans-serif; --font-d: "Pixelify Sans", "Rubik", system-ui, sans-serif;
  --console: #0e0e10; color-scheme: dark;
}
.mock[data-v="b"][data-mode="light"] {
  --g: #f1efe9; --s: #ffffff; --s2: #f8f7f3; --s3: #ecebe5; --ln: #e1ded5; --ln2: #cbc7bb;
  --tx: #1c1b18; --mu: #59564e; --fa: #6a675f;
  --ac: #2f9a4a; --ac-hi: #27843f; --ac-ink: #ffffff; --ac-soft: #dff1e3;
  --gold: #a26300; --gold-soft: #fbedd2;
  --ok: #217a39; --ok-soft: #dff1e3; --warn: #8f5600; --warn-soft: #fbedd2;
  --bad: #b3261e; --bad-soft: #fbe3df; --neu: #59564e; --neu-soft: #ecebe5;
  --sh: 0 4px 0 rgba(60,50,30,.10);
  --console: #1b1a17; color-scheme: light;
}
.mock[data-v="c"] {
  --g: #0b0c0d; --s: #121315; --s2: #17191b; --s3: #1e2023; --ln: #232629; --ln2: #3a3e43;
  --tx: #f4f5f6; --mu: #b0b5bb; --fa: #92989f;
  --ac: #2fd3a4; --ac-hi: #5ee3bd; --ac-ink: #052a20; --ac-soft: rgba(47,211,164,.13);
  --pri: #f4f5f6; --pri-ink: #0b0c0d;
  --ok: #2fd3a4; --ok-soft: rgba(47,211,164,.12); --warn: #f2bd5c; --warn-soft: rgba(242,189,92,.12);
  --bad: #f2828e; --bad-soft: rgba(242,130,142,.12); --neu: #b0b5bb; --neu-soft: rgba(176,181,187,.10);
  --sh: none;
  --r: 12px; --r-sm: 8px; --r-btn: 8px;
  --font: "Instrument Sans", "Segoe UI", system-ui, sans-serif; --font-d: var(--font);
  --console: #08090a; color-scheme: dark;
}
.mock[data-v="c"][data-mode="light"] {
  --g: #f6f7f8; --s: #ffffff; --s2: #fafbfb; --s3: #f0f2f3; --ln: #e5e8ea; --ln2: #cdd2d6;
  --tx: #111416; --mu: #575e65; --fa: #646b72;
  --ac: #0c9a74; --ac-hi: #087c5d; --ac-ink: #ffffff; --ac-soft: #dcf3ec;
  --pri: #15181b; --pri-ink: #ffffff;
  --ok: #0a7a5c; --ok-soft: #dcf3ec; --warn: #8c5a00; --warn-soft: #fcf0d6;
  --bad: #b1243a; --bad-soft: #fbe4e7; --neu: #575e65; --neu-soft: #eef0f2;
  --console: #111416; color-scheme: light;
}

/* ---------- Gemeinsames Panel ---------- */
.mock { background: var(--g); color: var(--tx); font: 14px/1.5 var(--font); display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 820px; }
.mock * { box-sizing: border-box; }
.mock svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mock svg.i.sm { width: 15px; height: 15px; }
.mock .num { font-variant-numeric: tabular-nums; }
.mock .mono { font-family: var(--mono); }
.mock button { font: inherit; color: inherit; cursor: pointer; }
.mock :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.pix { image-rendering: pixelated; display: block; flex: none; }

.sb { background: var(--s); border-right: 1px solid var(--ln); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; font: 800 17px/1 var(--font-d); letter-spacing: -0.01em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ac); display: grid; place-items: center; }
.brand .mark canvas, .brand .mark img { width: 18px; height: 18px; }
.switch { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--s2); border: 1px solid var(--ln); border-radius: var(--r-sm); padding: 9px 10px; }
.switch .t { flex: 1; min-width: 0; }
.switch .t b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switch .t span { color: var(--mu); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav .grp { color: var(--fa); font-size: 12px; padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--mu); text-decoration: none; font-weight: 500; }
.nav a:hover { color: var(--tx); background: var(--s2); }
.nav a[aria-current="page"] { color: var(--tx); background: var(--s3); }
.nav a .cnt { margin-left: auto; font-size: 12px; color: var(--mu); }
.sb-foot { margin-top: auto; display: grid; gap: 10px; }
.upd { display: grid; gap: 6px; background: var(--ac-soft); border-radius: var(--r-sm); padding: 12px; font-size: 13px; }
.upd b { font-weight: 600; }
.upd button { justify-self: start; background: var(--ac); color: var(--ac-ink); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.me .pix { width: 30px; height: 30px; border-radius: 7px; }
.me .t { font-size: 13px; line-height: 1.3; }
.me .t span { color: var(--mu); }

.mn { padding: 28px 32px 40px; display: grid; gap: 22px; align-content: start; min-width: 0; }
.title-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.title-row .tt { flex: 1; min-width: 220px; }
.title-row h2 { margin: 0; font: 700 26px/1.2 var(--font-d); letter-spacing: -0.02em; }
.title-row p { margin: 4px 0 0; color: var(--mu); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--r-btn); padding: 9px 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--ln2); background: var(--s2); color: var(--tx); white-space: nowrap; }
.btn.pri { background: var(--ac); border-color: transparent; color: var(--ac-ink); }
.btn.dng { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; gap: 6px; }
.btn.icon { padding: 8px; }

.card { background: var(--s); border: 1px solid var(--ln); border-radius: var(--r); box-shadow: var(--sh); min-width: 0; }
.card.pad { padding: 18px 20px; }
.card h3 { margin: 0; font: 600 15px/1.3 var(--font); }
.card .sub { color: var(--mu); font-size: 13px; }
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 14px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1.4 var(--font); letter-spacing: 0; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neu { background: var(--neu-soft); color: var(--neu); }
.pill.plain::before { display: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--mu); background: var(--s2); border: 1px solid var(--ln); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }

/* Host-Leiste */
.host { display: grid; grid-template-columns: 1.2fr repeat(3, minmax(0, 1fr)); gap: 0; padding: 0; }
.host > div { padding: 16px 20px; display: grid; gap: 6px; align-content: start; }
.host > div + div { border-left: 1px solid var(--ln); }
.host .lbl { color: var(--mu); font-size: 13px; }
.host .val { font: 700 20px/1.2 var(--font); }
.host .val small { font-size: 13px; color: var(--mu); font-weight: 500; }
.meter { height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ac); border-radius: 99px; }

/* Server-Karten */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.srv { padding: 18px; display: grid; gap: 14px; }
.srv-top { display: flex; gap: 12px; align-items: center; }
.srv-top .pix { width: 44px; height: 44px; border-radius: 10px; }
.srv-top .t { flex: 1; min-width: 0; }
.srv-top b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srv-top span { color: var(--mu); font-size: 13px; }
.addr { display: flex; align-items: center; gap: 8px; background: var(--s2); border: 1px solid var(--ln); border-radius: 8px; padding: 6px 6px 6px 10px; font: 500 13px/1.2 var(--mono); }
.addr span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.addr button { background: none; border: 0; color: var(--mu); padding: 4px; border-radius: 6px; display: grid; }
.addr button:hover { color: var(--tx); background: var(--s3); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--s2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .lbl { color: var(--mu); font-size: 12px; }
.stat .val { font-weight: 700; font-size: 15px; }
.stat svg.spark { width: 100%; height: 26px; display: block; margin-top: 4px; }
.srv-foot { display: flex; align-items: center; gap: 8px; }
.heads { display: flex; align-items: center; }
.heads .pix { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--s); margin-left: -6px; }
.heads .pix:first-child { margin-left: 0; }
.srv-foot .who { color: var(--mu); font-size: 13px; flex: 1; min-width: 0; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.msg.bad { background: var(--bad-soft); color: var(--tx); }
.msg.bad svg { color: var(--bad); }
.msg.warn { background: var(--warn-soft); }
.load { display: grid; gap: 6px; }
.load .meter i { background: var(--warn); }

/* Server-Seite */
.srv-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.srv-head .pix { width: 60px; height: 60px; border-radius: 14px; }
.srv-head .t { flex: 1; min-width: 240px; }
.srv-head h2 { margin: 0; font: 700 26px/1.2 var(--font-d); letter-spacing: -0.02em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.srv-head p { margin: 4px 0 0; color: var(--mu); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--ln); scrollbar-width: none; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--mu); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--tx); border-bottom-color: var(--ac); }
.tabs a .cnt { font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 1px 6px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.banner { display: flex; gap: 16px; align-items: center; padding: 18px 20px; flex-wrap: wrap; }
.banner .big { font: 700 20px/1.25 var(--font-d); }
.banner .t { flex: 1; min-width: 200px; }
.banner .t p { margin: 2px 0 0; color: var(--mu); }
.ipcard { padding: 0; overflow: hidden; }
.ip-main { padding: 20px; display: grid; gap: 12px; }
.ip-main .lbl { color: var(--mu); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.ip-big { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ip-big .v { font: 600 26px/1.15 var(--mono); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.ip-rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--ln); }
.ip-rows > div { padding: 14px 20px; display: grid; gap: 4px; min-width: 0; }
.ip-rows > div + div { border-left: 1px solid var(--ln); }
.ip-rows .lbl { color: var(--mu); font-size: 12px; }
.ip-rows .v { font: 500 14px/1.3 var(--mono); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.ip-rows .v button { background: none; border: 0; color: var(--mu); padding: 3px; display: grid; border-radius: 6px; }
.reach { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--ok-soft); flex-wrap: wrap; }
.reach .t { flex: 1; min-width: 200px; font-size: 13px; }
.reach .t b { display: block; font-size: 14px; color: var(--tx); }
.reach .t span { color: var(--mu); }
.reach .ico { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: var(--g); display: grid; place-items: center; }
.reach .ico svg { stroke-width: 2.6; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis > div { padding: 16px 20px; display: grid; gap: 4px; }
.kpis > div + div { border-left: 1px solid var(--ln); }
.kpis .lbl { color: var(--mu); font-size: 13px; }
.kpis .val { font: 700 22px/1.2 var(--font); }
.kpis .val small { font-size: 13px; color: var(--mu); font-weight: 500; }
.kpis svg.spark { width: 100%; height: 30px; display: block; }
.console { background: var(--console); border-radius: 12px; padding: 14px 16px; font: 12.5px/1.65 var(--mono); color: #cfd8d3; overflow-x: auto; }
.console div { white-space: pre; }
.console .tm { color: #6f817a; }
.console .in { color: #7fd8ff; }
.console .wn { color: #f6c26b; }
.console .ok { color: #58e0a4; }
.cmd { display: flex; gap: 8px; margin-top: 12px; }
.cmd input { flex: 1; min-width: 0; background: var(--s2); color: var(--tx); border: 1px solid var(--ln2); border-radius: 10px; padding: 9px 12px; font: 13px var(--mono); }
.players { display: grid; gap: 4px; }
.player { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; }
.player .pix { width: 26px; height: 26px; border-radius: 5px; }
.player b { flex: 1; font-weight: 600; font-size: 13px; }
.player span { color: var(--mu); font-size: 12px; }
.list { display: grid; }
.list > div { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.list > div + div { border-top: 1px solid var(--ln); }
.list .t { flex: 1; min-width: 0; }
.list .t b { display: block; font-weight: 600; font-size: 13.5px; }
.list .t span { color: var(--mu); font-size: 12.5px; }
.list .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--s2); display: grid; place-items: center; color: var(--mu); flex: none; }

/* Marktplatz */
.subtabs { display: inline-flex; gap: 4px; background: var(--s); border: 1px solid var(--ln); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.subtabs a { padding: 7px 12px; border-radius: 8px; color: var(--mu); text-decoration: none; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }

  /* ---------- Rendern ---------- */
  var mock = document.getElementById('mock');
  function render() {
    mock.setAttribute('data-v', state.v);
    mock.setAttribute('data-mode', state.m);
    var main = state.s === 'dash' ? dashboard() : state.s === 'server' ? serverPage() : market();
    mock.innerHTML = sidebar(state.s) + '<main class="mn">' + main + '</main>';
    [['variants', 'v'], ['screens', 's'], ['modes', 'm']].forEach(function (g) {
      document.querySelectorAll('#' + g[0] + ' button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-' + g[1]) === state[g[1]])); });
    });
    try { localStorage.setItem('mh-mock', JSON.stringify(state)); } catch (e) {}
  }
  [['variants', 'v'], ['screens', 's'], ['modes', 'm']].forEach(function (g) {
    document.getElementById(g[0]).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state[g[1]] = b.getAttribute('data-' + g[1]); render();
    });
  });
  mock.addEventListener('click', function (e) { if (e.target.closest('a')) e.preventDefault(); });
  render();
})();
</script>
